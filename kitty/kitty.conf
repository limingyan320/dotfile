# Neovim's background adapter controls only the focused Kitty OS window and
# restores its opacity when the last Nvim UI detaches. The socket is restricted
# by Kitty to processes owned by the same user.
allow_remote_control socket
# Kitty resolves relative listen_on paths inside its platform-specific temp dir.
listen_on unix:dotfiles-kitty-{kitty_pid}
remote_control_password "dotfiles nvim background" ls set-background-image set-background-opacity

dynamic_background_opacity yes
background_image none
background_image_linear yes

# Match iTerm2's Esc+/Alt Option behavior so terminal applications receive
# Neovim mappings such as Option+A, Option+/, and Option++/Option+-.
macos_option_as_alt both


# BEGIN_KITTY_FONTS
font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 15.0
# END_KITTY_FONTS

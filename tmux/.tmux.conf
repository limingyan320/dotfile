set -g mode-keys vi

# --- 跨平台剪贴板 ---
# macOS 用 pbcopy，Linux/WSL 用 xclip 或 xsel
if-shell "uname | grep -q Darwin" \
    'set -g @copy_cmd "pbcopy"' \
    'set -g @copy_cmd "xclip -selection clipboard"'

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
unbind -T copy-mode-vi Enter
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_cmd}"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "#{@copy_cmd}"

# 双击：选中单词并复制，不退出 Copy Mode
bind -T copy-mode-vi DoubleClick1Pane send-keys -X select-word \; send-keys -X copy-pipe "#{@copy_cmd}"
# 三击：选中整行并复制，不退出 Copy Mode
bind -T copy-mode-vi TripleClick1Pane send-keys -X select-line \; send-keys -X copy-pipe "#{@copy_cmd}"

# Option+Left/Right 跳词
bind -T copy-mode-vi M-Left send-keys -X previous-word
bind -T copy-mode-vi M-b send-keys -X previous-word
bind -T copy-mode-vi M-Right send-keys -X next-word-end
bind -T copy-mode-vi M-f send-keys -X next-word-end

# --- 终端颜色 ---
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# --- Evergreen 主题 ---
set -g status-style "bg=#272e33,fg=#d3c6aa"
set -g status-left "#[bg=#a7c080,fg=#272e33,bold] #S #[fg=#a7c080,bg=#272e33] "
set -g status-right "#[fg=#a7c080]#[bg=#a7c080,fg=#272e33,bold] #h  %H:%M "
set -g status-left-length 30
set -g status-right-length 40

set -g window-status-format "#[fg=#272e33,bg=#2e383c]#[fg=#859289,bg=#2e383c] #I:#W #[fg=#2e383c,bg=#272e33]"
set -g window-status-current-format "#[fg=#272e33,bg=#a7c080]#[fg=#272e33,bg=#a7c080,bold] #I:#W #[fg=#a7c080,bg=#272e33]"
set -g window-status-separator ""

set -g pane-border-style "fg=#2e383c"
set -g pane-active-border-style "fg=#a7c080"
set -g pane-border-status top
set -g pane-border-format " #[bold]#{pane_index}#[nobold] #{pane_current_command} #[fg=#859289]#{s|$HOME|~|:pane_current_path} "

set -g display-panes-time 2000
set -g display-panes-colour "#859289"
set -g display-panes-active-colour "#a7c080"

set -g message-style "bg=#2e383c,fg=#d3c6aa"

# --- 鼠标 ---
set -g mouse on

# --- 分割 pane ---
bind v split-window -hb  # 左边
bind s split-window -vb  # 上边

# --- pane 移动 ---
bind J command-prompt -p "join pane from window:" "join-pane -s ':%%'"
bind S command-prompt -p "send pane to window:" "join-pane -t ':%%'"
